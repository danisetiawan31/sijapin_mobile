<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Warm Aura Gradient -->
    <radialGradient id="doctorAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F4E8D3" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#F7F3ED" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#FAF8F5" stop-opacity="0"/>
    </radialGradient>

    <!-- Teal Gradient -->
    <linearGradient id="docTealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B7369"/>
      <stop offset="100%" stop-color="#2A9D8F"/>
    </linearGradient>

    <!-- Golden Caramel Gradient -->
    <linearGradient id="docGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#AA7409"/>
      <stop offset="100%" stop-color="#B88214"/>
    </linearGradient>

    <!-- Glass Magnifier Gradient -->
    <linearGradient id="lensGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#E0F5F0" stop-opacity="0.3"/>
    </linearGradient>

    <!-- Soft Shadow Filter -->
    <filter id="docShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#1C140E" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- 1. Ambient Background Aura -->
  <circle cx="100" cy="100" r="90" fill="url(#doctorAura)"/>

  <!-- 2. Ground Shadow -->
  <ellipse cx="100" cy="172" rx="65" ry="8" fill="#1C140E" opacity="0.06"/>

  <!-- 3. Doctor ID Card / Profile Plaque -->
  <g filter="url(#docShadow)">
    <rect x="55" y="45" width="90" height="115" rx="18" fill="#FFFFFF" stroke="#F4E8D3" stroke-width="1.5"/>
    
    <!-- Top Decorative Line -->
    <path d="M 68 45 L 132 45 C 137.5 45 142 49.5 142 55 L 142 58 L 58 58 L 58 55 C 58 49.5 62.5 45 68 45 Z" fill="url(#docGoldGrad)"/>
    
    <!-- Lanyard / Clip Hole -->
    <rect x="90" y="50" width="20" height="5" rx="2.5" fill="#FFFFFF"/>

    <!-- Doctor Silhouette Avatar Circle -->
    <circle cx="100" cy="85" r="24" fill="#E8F4F2"/>
    
    <!-- Doctor Head -->
    <circle cx="100" cy="78" r="10" fill="#1B7369"/>
    
    <!-- Doctor Shoulders (Clipped to circle) -->
    <path d="M 82 104 C 82 94 90 92 100 92 C 110 92 118 94 118 104 C 113 108 106 109 100 109 C 94 109 87 108 82 104 Z" fill="#2A9D8F"/>
    <!-- V-Neck Lab Coat Accent -->
    <polygon points="100,92 96,102 104,102" fill="#FFFFFF"/>

    <!-- Card Content Placeholder Lines -->
    <rect x="75" y="118" width="50" height="5" rx="2.5" fill="#AA7409" opacity="0.8"/>
    <rect x="82" y="128" width="36" height="4" rx="2" fill="#BCE0DA"/>
    <rect x="78" y="136" width="44" height="4" rx="2" fill="#E8F4F2"/>
  </g>

  <!-- 4. Magnifying Glass (Search Motif) -->
  <g filter="url(#docShadow)">
    <!-- Lens Ring -->
    <circle cx="135" cy="125" r="26" fill="url(#lensGrad)" stroke="#1B7369" stroke-width="4"/>
    
    <!-- Inner Lens Reflection Highlight -->
    <path d="M 120 115 A 18 18 0 0 1 145 110" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Magnifier Handle -->
    <line x1="154" y1="144" x2="174" y2="164" stroke="#AA7409" stroke-width="6" stroke-linecap="round"/>
    <line x1="154" y1="144" x2="170" y2="160" stroke="#B88214" stroke-width="3" stroke-linecap="round"/>

    <!-- Question Mark / Search Indicator Inside Lens -->
    <text x="135" y="133" font-family="sans-serif" font-size="22" font-weight="900" fill="#1B7369" text-anchor="middle">?</text>
  </g>

  <!-- 5. Ambient Micro Sparkles & Medical Crosses -->
  <!-- Plus 1 (Teal) -->
  <path d="M 36 68 L 44 68 M 40 64 L 40 72" stroke="#2A9D8F" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Plus 2 (Gold) -->
  <path d="M 158 56 L 166 56 M 162 52 L 162 60" stroke="#AA7409" stroke-width="2" stroke-linecap="round"/>
  <!-- Gentle Dots -->
  <circle cx="48" cy="138" r="3.5" fill="#BCE0DA"/>
  <circle cx="165" cy="95" r="3" fill="#AA7409" opacity="0.6"/>
</svg>
