<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 220" width="100%" height="100%">
  <defs>
    <!-- Ambient Healthcare Aura -->
    <radialGradient id="regAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E8F5F2" stop-opacity="0.9"/>
      <stop offset="65%" stop-color="#E0F5F0" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#FAF8F5" stop-opacity="0"/>
    </radialGradient>

    <!-- Phone Glass Body Gradient -->
    <linearGradient id="phoneBodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F3FAF8"/>
    </linearGradient>

    <!-- Hospital Clinical Teal Gradient -->
    <linearGradient id="clinicTealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B7369"/>
      <stop offset="100%" stop-color="#145C54"/>
    </linearGradient>

    <!-- Calendar Header Gradient -->
    <linearGradient id="calHeaderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2A9D8F"/>
      <stop offset="100%" stop-color="#1B7369"/>
    </linearGradient>

    <!-- Emerald Success Gradient -->
    <linearGradient id="successGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15803D"/>
      <stop offset="100%" stop-color="#22C55E"/>
    </linearGradient>

    <!-- Metallic Stethoscope Gradient -->
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="50%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>
  </defs>

  <!-- 1. Ambient Background Aura -->
  <circle cx="110" cy="110" r="98" fill="url(#regAura)"/>

  <!-- 2. Base Ground Shadow -->
  <ellipse cx="110" cy="192" rx="76" ry="10" fill="#1C140E" opacity="0.06"/>

  <!-- 3. Smartphone Device Body Shadow -->
  <rect x="55" y="28" width="116" height="162" rx="20" fill="#1C140E" opacity="0.06"/>

  <!-- 3b. Smartphone Device Body -->
  <g>
    <!-- Outer Bezel -->
    <rect x="52" y="24" width="116" height="162" rx="20" fill="url(#phoneBodyGrad)" stroke="#BCE0DA" stroke-width="1.8"/>

    <!-- Speaker / Dynamic Island Notch -->
    <rect x="96" y="31" width="28" height="4" rx="2" fill="#BCE0DA"/>

    <!-- Screen Area Background -->
    <rect x="58" y="40" width="104" height="138" rx="14" fill="#FFFFFF"/>

    <!-- Screen Header Bar (RSUP Dr. Sitanala Clinical) -->
    <rect x="58" y="40" width="104" height="28" rx="14" fill="url(#clinicTealGrad)"/>
    <rect x="58" y="54" width="104" height="14" fill="url(#clinicTealGrad)"/> <!-- Fill bottom corners of header -->

    <!-- Header Cross Icon -->
    <rect x="68" y="48" width="12" height="12" rx="3" fill="#E8F4F2"/>
    <path d="M 74 51 L 74 57 M 71 54 L 77 54" stroke="#1B7369" stroke-width="1.8" stroke-linecap="round"/>

    <!-- Header Text Line -->
    <rect x="85" y="50" width="46" height="4" rx="2" fill="#FFFFFF" opacity="0.9"/>
    <rect x="85" y="56" width="28" height="3" rx="1.5" fill="#E8F4F2" opacity="0.75"/>

    <!-- Calendar Booking Card inside Screen -->
    <g transform="translate(64, 74)">
      <!-- Calendar Container -->
      <rect x="0" y="0" width="92" height="54" rx="8" fill="#F8FCFB" stroke="#BCE0DA" stroke-width="1"/>

      <!-- Calendar Header -->
      <rect x="0" y="0" width="92" height="14" rx="8" fill="url(#calHeaderGrad)"/>
      <rect x="0" y="8" width="92" height="6" fill="url(#calHeaderGrad)"/>
      <circle cx="12" cy="7" r="1.8" fill="#FFFFFF"/>
      <circle cx="80" cy="7" r="1.8" fill="#FFFFFF"/>
      <rect x="28" y="5" width="36" height="3.5" rx="1.7" fill="#FFFFFF"/>

      <!-- Calendar Grid Matrix -->
      <!-- Row 1 -->
      <rect x="8" y="20" width="9" height="9" rx="2" fill="#E8F4F2"/>
      <rect x="23" y="20" width="9" height="9" rx="2" fill="#E8F4F2"/>
      <rect x="38" y="20" width="9" height="9" rx="2" fill="#E8F4F2"/>
      <rect x="53" y="20" width="9" height="9" rx="2" fill="#E8F4F2"/>
      <rect x="68" y="20" width="9" height="9" rx="2" fill="#E8F4F2"/>

      <!-- Row 2 (Selected Date Highlighted in Teal) -->
      <rect x="8" y="34" width="9" height="9" rx="2" fill="#E8F4F2"/>
      <rect x="23" y="34" width="9" height="9" rx="2" fill="#1B7369"/> <!-- Active Date -->
      <circle cx="27.5" cy="38.5" r="1.8" fill="#FFFFFF"/>
      <rect x="38" y="34" width="9" height="9" rx="2" fill="#E8F4F2"/>
      <rect x="53" y="34" width="9" height="9" rx="2" fill="#E8F4F2"/>
      <rect x="68" y="34" width="9" height="9" rx="2" fill="#E8F4F2"/>
    </g>

    <!-- Queue Badge / Poli Reguler Ticket -->
    <g transform="translate(64, 134)">
      <rect x="0" y="0" width="92" height="34" rx="8" fill="#E8F4F2" stroke="#BCE0DA" stroke-width="1"/>
      <!-- Queue Label -->
      <rect x="8" y="8" width="42" height="7" rx="3.5" fill="#1B7369"/>
      <rect x="8" y="19" width="30" height="6" rx="2" fill="#AA7409" opacity="0.8"/>
      <!-- Barcode Lines Dummy -->
      <line x1="58" y1="8" x2="58" y2="26" stroke="#1B7369" stroke-width="2"/>
      <line x1="63" y1="8" x2="63" y2="26" stroke="#1B7369" stroke-width="1.2"/>
      <line x1="67" y1="8" x2="67" y2="26" stroke="#1B7369" stroke-width="2.5"/>
      <line x1="73" y1="8" x2="73" y2="26" stroke="#1B7369" stroke-width="1"/>
      <line x1="77" y1="8" x2="77" y2="26" stroke="#1B7369" stroke-width="2"/>
    </g>
  </g>


  <!-- 5. Modern Clinical Stethoscope Looping Around Base -->
  <g>
    <!-- Stethoscope Tube Shadow -->
    <path d="M 38 155 C 32 178, 55 198, 86 195 C 112 192, 138 185, 160 178" fill="none" stroke="#1C140E" stroke-width="6" opacity="0.08" stroke-linecap="round"/>
    
    <!-- Stethoscope Tube (Deep Teal) -->
    <path d="M 38 152 C 32 175, 55 195, 86 192 C 112 189, 138 182, 160 175" fill="none" stroke="#1B7369" stroke-width="5.5" stroke-linecap="round"/>
    <path d="M 40 152 C 34 174, 56 193, 86 190" fill="none" stroke="#2A9D8F" stroke-width="1.8" stroke-linecap="round"/> <!-- Highlight -->

    <!-- Metallic Chestpiece / Diaphragm (Front Left) -->
    <g transform="translate(38, 148)">
      <!-- Outer Metal Ring Shadow -->
      <circle cx="2" cy="3" r="17" fill="#1C140E" opacity="0.08"/>
      <!-- Outer Metal Ring -->
      <circle cx="0" cy="0" r="17" fill="url(#metalGrad)" stroke="#94A3B8" stroke-width="1"/>
      <!-- Inner Diaphragm Circle -->
      <circle cx="0" cy="0" r="12" fill="#E8F4F2" stroke="#1B7369" stroke-width="1.5"/>
      <!-- Center Core -->
      <circle cx="0" cy="0" r="4.5" fill="url(#clinicTealGrad)"/>
      <circle cx="-1.5" cy="-1.5" r="1.2" fill="#FFFFFF"/> <!-- Glint -->
    </g>
  </g>

  <!-- 6. Floating Micro Sparkles & Stars -->
  <!-- Gold Plus Accents -->
  <path d="M 32 62 L 38 62 M 35 59 L 35 65" stroke="#AA7409" stroke-width="2" stroke-linecap="round"/>
  <path d="M 186 112 L 192 112 M 189 109 L 189 115" stroke="#2A9D8F" stroke-width="2" stroke-linecap="round"/>
  <!-- Floating Soft Dots -->
  <circle cx="44" cy="98" r="2.8" fill="#2A9D8F" opacity="0.6"/>
  <circle cx="178" cy="148" r="3" fill="#AA7409" opacity="0.75"/>
</svg>
