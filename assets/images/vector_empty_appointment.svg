<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Ambient Glow Gradient -->
    <radialGradient id="emptyAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E0F5F0" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#E8F4F2" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#FAF8F5" stop-opacity="0"/>
    </radialGradient>
    
    <!-- Clipboard Gradient -->
    <linearGradient id="clipboardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F7F3ED"/>
    </linearGradient>

    <!-- Teal Header Gradient -->
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B7369"/>
      <stop offset="100%" stop-color="#2A9D8F"/>
    </linearGradient>

    <!-- Golden Accent Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#AA7409"/>
      <stop offset="100%" stop-color="#B88214"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#1C140E" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- 1. Ambient Background Aura -->
  <circle cx="100" cy="100" r="90" fill="url(#emptyAura)"/>

  <!-- 2. Ground Shadow -->
  <ellipse cx="100" cy="172" rx="65" ry="8" fill="#1C140E" opacity="0.06"/>

  <!-- 3. Medical Clipboard Body -->
  <g filter="url(#softShadow)">
    <rect x="52" y="42" width="96" height="122" rx="14" fill="url(#clipboardGrad)" stroke="#BCE0DA" stroke-width="1.5"/>
    
    <!-- Clipboard Top Header Bar -->
    <path d="M 53 56 C 53 48.2 59.2 42 67 42 L 133 42 C 140.8 42 147 48.2 147 56 L 147 68 L 53 68 Z" fill="url(#tealGrad)"/>
    
    <!-- Top Clip Mechanism -->
    <rect x="78" y="34" width="44" height="16" rx="6" fill="#F4E8D3" stroke="#AA7409" stroke-width="1.2"/>
    <circle cx="100" cy="42" r="3.5" fill="#AA7409"/>
  </g>

  <!-- 4. Calendar Grid / Schedule Content -->
  <!-- Month Lines -->
  <rect x="68" y="80" width="64" height="4" rx="2" fill="#BCE0DA"/>
  
  <!-- Calendar Days Matrix -->
  <!-- Row 1 -->
  <rect x="68" y="94" width="12" height="12" rx="3" fill="#E8F4F2"/>
  <rect x="85" y="94" width="12" height="12" rx="3" fill="#E8F4F2"/>
  <rect x="102" y="94" width="12" height="12" rx="3" fill="#E8F4F2"/>
  <rect x="120" y="94" width="12" height="12" rx="3" fill="#FDE8C7"/>

  <!-- Row 2 -->
  <rect x="68" y="112" width="12" height="12" rx="3" fill="#E8F4F2"/>
  <rect x="85" y="112" width="12" height="12" rx="3" fill="#E8F4F2"/>
  <rect x="102" y="112" width="12" height="12" rx="3" fill="#E8F4F2"/>
  <rect x="120" y="112" width="12" height="12" rx="3" fill="#E8F4F2"/>

  <!-- Row 3 -->
  <rect x="68" y="130" width="12" height="12" rx="3" fill="#E8F4F2"/>
  <rect x="85" y="130" width="12" height="12" rx="3" fill="#E8F4F2"/>
  <rect x="102" y="130" width="12" height="12" rx="3" fill="#E8F4F2"/>
  <rect x="120" y="130" width="12" height="12" rx="3" fill="#E8F4F2"/>

  <!-- 5. Empty State Indicator Stamp: Gentle Medical Clock / Stethoscope Accent -->
  <circle cx="132" cy="142" r="22" fill="#FFFFFF" stroke="#BCE0DA" stroke-width="1.5" filter="url(#softShadow)"/>
  <circle cx="132" cy="142" r="18" fill="#E0F5F0"/>
  <!-- Clock Hands indicating waiting/empty -->
  <circle cx="132" cy="142" r="2.5" fill="#1B7369"/>
  <line x1="132" y1="142" x2="132" y2="132" stroke="#1B7369" stroke-width="2" stroke-linecap="round"/>
  <line x1="132" y1="142" x2="140" y2="142" stroke="#AA7409" stroke-width="2" stroke-linecap="round"/>

  <!-- 6. Stethoscope Floating Motif -->
  <!-- Binaural Spring and Tubes -->
  <path d="M 42 110 C 34 125, 34 150, 48 160 C 58 168, 74 164, 82 152" fill="none" stroke="#1C140E" stroke-width="3" stroke-linecap="round"/>
  <!-- Chestpiece -->
  <circle cx="84" cy="150" r="7" fill="#2A9D8F"/>
  <circle cx="84" cy="150" r="4" fill="#FFFFFF"/>

  <!-- 7. Ambient Micro-Elements (Floating Healthcare Sparkles & Plus) -->
  <!-- Plus 1 (Teal) -->
  <path d="M 154 58 L 162 58 M 158 54 L 158 62" stroke="#2A9D8F" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Plus 2 (Gold) -->
  <path d="M 38 78 L 44 78 M 41 75 L 41 81" stroke="#AA7409" stroke-width="2" stroke-linecap="round"/>
  <!-- Heart Dot -->
  <circle cx="160" cy="112" r="3.5" fill="#AA7409" opacity="0.6"/>
  <circle cx="44" cy="48" r="4" fill="#BCE0DA"/>
</svg>
